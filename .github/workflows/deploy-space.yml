name: Deploy Hugging Face Space

# Publishes hf-space/ (the Gradio app with every POC tab) to a public Hugging Face Space.
# Runs on every push that touches hf-space/ on the scanner branch, and on demand from Actions.
#
# Setup (once):
#   - Secret HF_TOKEN: a Hugging Face token with write access.
#   - Optional variable HF_SPACE_ID. Default: osoman2/Gradio_pocs (the existing POC Space).
#     It is only created if it does not exist (creating new Spaces may need a paid HF plan).
#   - First deploy: after adding the secret, open the latest "Deploy Hugging Face Space" run in
#     Actions and click "Re-run all jobs".

on:
  push:
    branches: [claude/implement-hybrid-search-WEN8O]
    paths: ['hf-space/**', '.github/workflows/deploy-space.yml']
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

# Space builds can take a while on the free CPU tier.

jobs:
  smoke:
    # Same gate as pull requests. A direct push that breaks the app never reaches the Space.
    uses: ./.github/workflows/smoke-test.yml

  deploy:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Always deploy the scanner branch, even when triggered from main.
          ref: claude/implement-hybrid-search-WEN8O

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet "huggingface_hub>=0.25"

      - name: Upload hf-space/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, sys, traceback
          from huggingface_hub import HfApi

          def fail(msg):
              # ::error:: becomes a run annotation, readable without downloading logs.
              # Newlines must be escaped or the annotation keeps only the first line.
              msg = str(msg).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error::{msg}")
              sys.exit(1)

          token = os.environ.get("HF_TOKEN", "").strip()
          if not token:
              fail("Missing secret HF_TOKEN: add it in Settings > Secrets and variables > Actions, then re-run.")
          api = HfApi(token=token)
          try:
              user = api.whoami()["name"]
          except Exception as e:
              fail(f"HF token rejected by whoami ({type(e).__name__}): {str(e)[:300]}")
          space_id = os.environ.get("HF_SPACE_ID") or "osoman2/Gradio_pocs"

          try:
              spaces = [s.id for s in api.list_spaces(author=user)]
              print(f"::notice::Spaces under {user}: {', '.join(spaces) or '(none)'}")
          except Exception as e:
              print(f"::warning::Could not list spaces: {str(e)[:200]}")

          if not api.repo_exists(space_id, repo_type="space"):
              try:
                  api.create_repo(space_id, repo_type="space", space_sdk="gradio", private=False)
              except Exception as e:
                  fail(f"create_repo {space_id} failed ({type(e).__name__}): {str(e)[:300]}")
          try:
              api.upload_folder(
                  folder_path="hf-space",
                  repo_id=space_id,
                  repo_type="space",
                  commit_message=f"Sync from GitHub {os.environ['COMMIT_SHA'][:7]}",
                  ignore_patterns=["**/__pycache__/**", "**/*.pyc"],
              )
          except Exception as e:
              traceback.print_exc()
              fail(f"upload_folder to {space_id} failed ({type(e).__name__}): {str(e)[:300]}")

          url = f"https://huggingface.co/spaces/{space_id}"
          print(f"::notice::Uploaded to {url}; waiting for the Space to build")

          # Wait for the Space to build and start, so a broken app fails this run instead of silently.
          import time
          deadline = time.time() + 20 * 60
          stage = "UNKNOWN"
          # The runtime still reports the previous state right after upload: wait for the rebuild to start.
          start_wait = time.time() + 5 * 60
          while time.time() < start_wait:
              stage = api.get_space_runtime(space_id).stage
              if stage in ("BUILDING", "APP_STARTING", "RUNNING_BUILDING", "RUNNING_APP_STARTING"):
                  break
              time.sleep(10)
          while time.time() < deadline:
              rt = api.get_space_runtime(space_id)
              stage = rt.stage
              if stage == "RUNNING":
                  break
              if stage.endswith("ERROR"):
                  msg = (rt.raw or {}).get("errorMessage", "")
                  fail(f"Space {stage}: {str(msg)[-3000:]}")
              time.sleep(20)
          if stage != "RUNNING":
              fail(f"Space did not reach RUNNING in 20 min (last stage: {stage})")
          print(f"::notice::Space running: {url}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"Space deployed: {url}\n")
          PY

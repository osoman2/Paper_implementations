name: Smoke test

# Gate for every PR into the deploy branch: the app must import, render, serve pages, run every
# event handler with default and example inputs, keep the locked pins, and stay readable by the
# vectorridgelabs.com Lab catalog. Mark the "smoke" job as a required status check.
#
# No `paths:` filter on purpose: a required check that is skipped by a path filter stays
# "pending" forever and blocks the merge.

# Also called by deploy-space.yml, so nothing is uploaded to the Space without passing it.

on:
  pull_request:
    branches: [deploy]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hf-space/requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('hf-space/requirements.txt') }}
          restore-keys: hf-models-

      - name: Install pinned dependencies
        run: |
          # CPU-only torch keeps the install small; the Space runs on CPU too.
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r hf-space/requirements.txt pytest requests

      - name: Run smoke tests
        run: |
          set -o pipefail
          pytest tests/ -q -rA --tb=short -W ignore::DeprecationWarning 2>&1 | tee smoke.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Smoke test"
            echo '```'
            grep -E "handler calls|  #|slow:|offline:|passed|failed|error" smoke.log | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
